[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#1F6FEB"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F6F7F9"
textColor = "#16191D"
borderColor = "#E4E7EC"

# 폰트 파일 자체는 app.py의 @import가 불러온다. 여기서는 이름만 지정한다.
# (URL 형식은 Streamlit이 단일 폰트만 허용해 테마 로딩이 통째로 실패한다)
font = "Inter, Noto Sans KR, Malgun Gothic, 맑은 고딕, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
codeFont = "JetBrains Mono, D2Coding, Consolas, DejaVu Sans Mono, Courier New, monospace"
