name: 뉴스 자동 수집

on:
  schedule:
    # 매일 07:00 KST (= 22:00 UTC 전날). GitHub 부하 분산으로 몇 분 늦을 수 있습니다.
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "분석할 최대 기사 수 (비우면 전체)"
        required: false
        default: ""
      hours:
        description: "수집 윈도우(시간)"
        required: false
        default: "48"

# 동시에 두 번 돌면 DB 커밋이 충돌하므로 한 번에 하나만 실행한다
concurrency:
  group: collect-news
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: news-dashboard/requirements.txt

      - name: 의존성 설치
        working-directory: news-dashboard
        run: pip install -r requirements.txt

      - name: 뉴스 수집 및 분석
        working-directory: news-dashboard
        env:
          LLM_PROVIDER: gemini
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
          LLM_REQUEST_DELAY: ${{ vars.LLM_REQUEST_DELAY || '5' }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ inputs.limit }}"; fi
          if [ -n "${{ inputs.hours }}" ]; then ARGS="$ARGS --hours ${{ inputs.hours }}"; fi
          python main.py $ARGS

      - name: 수집 결과 커밋
        if: always()
        working-directory: news-dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ ! -f data/news.db ]; then
            echo "data/news.db 가 없습니다. 수집 단계가 실패한 것으로 보입니다."
            exit 0
          fi
          # data/news.db 는 .gitignore 대상이라 CI에서만 의도적으로 -f 로 추가한다
          git add -f data/news.db
          if git diff --staged --quiet; then
            echo "새로 저장된 기사가 없어 커밋하지 않습니다."
          else
            git commit -m "chore: 뉴스 자동 수집 $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash
            git push
          fi

      - name: 수집 요약
        if: always()
        working-directory: news-dashboard
        run: |
          [ -f data/news.db ] || { echo "DB 없음 — 요약 생략"; exit 0; }
          python - <<'PY'
          import db
          s = db.get_stats()
          print(f"### 수집 결과", file=open('summary.md','w'))
          with open('summary.md','a') as f:
              f.write(f"\n\n- 전체 기사: **{db.count_articles()}건**\n")
              f.write(f"- 기회 {s['기회']}건 / 위협 {s['위협']}건 / 중립 {s['중립']}건\n")
          PY
          cat summary.md >> $GITHUB_STEP_SUMMARY
          rm -f summary.md
